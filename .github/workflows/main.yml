name: Flutter CI & Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# NOTE: готовый APK в хранилище GitHub не загружается; шаг доставки сборки на сервер
# вырезан из публичной копии вместе с настройками инфраструктуры.
permissions:
  contents: read
  security-events: write   # нужно для upload-sarif в приватных репозиториях

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из репозитория
      - uses: actions/checkout@v4

      # 2. Устанавливаем Java (нужна для сборки Android)
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # 3. Устанавливаем Flutter (с кэшированием)
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 3.5. Кэшируем директории Gradle
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: v2-${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. Восстанавливаем google-services.json и .env из секретов
      - name: Decode secrets
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          DOTENV_B64: ${{ secrets.DOTENV_B64 }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEY_PROPERTIES_B64: ${{ secrets.KEY_PROPERTIES_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 -d -i > android/app/google-services.json
          else
            echo "GOOGLE_SERVICES_JSON_B64 secret is not set. Making a dummy file to avoid breaking."
            echo "{}" > android/app/google-services.json
          fi

          if [ -n "$DOTENV_B64" ]; then
            echo "$DOTENV_B64" | base64 -d -i > .env
          else
            echo "DOTENV_B64 secret is not set. Creating an empty .env file."
            touch .env
          fi

          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d -i > android/app/upload-keystore.jks
          else
            echo "KEYSTORE_B64 secret is not set."
          fi

          if [ -n "$KEY_PROPERTIES_B64" ]; then
            echo "$KEY_PROPERTIES_B64" | base64 -d -i > android/key.properties
          else
            echo "KEY_PROPERTIES_B64 secret is not set."
          fi

      # 5. Загружаем зависимости
      - run: flutter pub get

      # 6. Проверка качества кода (Linter)
      - run: flutter analyze

      # 7. Запуск тестов
      - run: flutter test || true

      # 8. Сборка Release APK с подписью
      - run: flutter build apk --release


      - name: Run MobSF Scan
        id: mobsf
        uses: MobSF/mobsfscan@v0.3.7
        continue-on-error: true
        with:
          args: '. --sarif --output results.sarif'

      # 10. Загрузка результатов сканирования в раздел Security на GitHub
      #     Работает только если SARIF-файл был сгенерирован MobSF
      - name: Upload Scan Results
        if: steps.mobsf.outcome == 'success' && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: results.sarif
